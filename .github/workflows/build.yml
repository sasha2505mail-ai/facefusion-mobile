name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4.2.2 # Обновлено до стабильной версии

      - name: Setup Java 17
        uses: actions/setup-java@v4.5.0 # Обновлено с исправлениями для Node24
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission
        run: chmod +x work/android/gradlew

      - name: Build APK
        run: |
          cd work/android
          # --no-daemon отключает фоновые процессы Java, которые убивал сервер
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.4.0 # Обновленная версия загрузчика
        with:
          name: facefusion-mod-apk
          path: work/android/app/build/outputs/apk/debug/*.apk
