name: Build Android APK

on:
  push:
    branches: [ main, master ] # Сработает автоматически при любом изменении кода в этих ветках
  workflow_dispatch: # Позволит запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission
        run: chmod +x work/android/gradlew

      - name: Build APK
        run: |
          cd work/android
          ./gradlew clean assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: facefusion-mod-apk
          path: work/android/app/build/outputs/apk/debug/*.apk
